name: Deploy Angular App

on:
  push:
    branches: ["main"]   
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Add .nojekyll file
        run: touch ./dist/my-project/browser/.nojekyll

      - name: Copy index.html to 404.html
        run: cp ./dist/my-project/browser/index.html ./dist/my-project/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/my-project/browser'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
