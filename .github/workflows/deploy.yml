name: Deploy Angular App

on:
  push:
    branches: ["main"]   
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Add .nojekyll file
        run: touch ./dist/sundar-singh-web/browser/.nojekyll

      - name: Copy index.html to 404.html
        run: cp ./dist/sundar-singh-web/browser/index.html ./dist/sundar-singh-web/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/sundar-singh-web/browser'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
